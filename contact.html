<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <title>Contact</title>
</head>

<body>

    <!-- Le header et le footer sont intégrés par un script javascript -->
    <header></header>

    <main id="contact">

            <div class="menu-contact">
                <h1>Nous contacter</h1>
                    <p>
                        Une question ? Un renseignement ?<br>
                        Ecrivez-nous !
                    </p>
                <form action="https://api.web3forms.com/submit" method="post">
                    <input type="hidden" name="access_key" value="c1e1572c-571a-493c-9843-2af0d7c821be">
                    <label for="name">Nom :</label>
                    <input type="text" id="name" name="name" placeholder="Votre nom" required ><br><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Votre email" required><br><br>
                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" placeholder="Votre message" required></textarea><br><br>
                     
                    <button type="submit" value="send" class="submit-button">
                        Envoyer
                    </button>
            </form>

    </main>

    <footer></footer>

    <script type="module" src="./javascript/index.js"></script>
    <script src="./javascript/component.js"></script>
    
</body>
</html>
