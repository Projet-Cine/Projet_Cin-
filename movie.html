<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <title>CinéVillage</title>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <ul>
                <li><a href="/index.html" class="nav-link">Acceuil</a></li>
                <li><a href="/boutique.html" class="nav-link">Boutique</a></li>
                <li>
                    <a href="/index.html" class="logo">
                        <img src="/img/Logo cinéma.png" alt="logo CinéVillage" class="logo">
                    </a>
                </li>
                <li><a href="/contact.html" class="nav-link">Contact</a></li>
                <li><a href="/panier.html" class="nav-link" aria-label="Voir mon panier"><i class="fa-solid fa-cart-shopping"></i></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="short">
            <div class="detail-produit">
                <div class="img-produit">
                    <img id="film-poster" src="" alt="Affiche du film">
                    
                </div>
                <div class="produit-info">
                    <h1 id="film-titre">Chargement du film...</h1>

                    <p id="film-genre"></p>

                    <h2>Synopsis</h2>
                    <p id="film-description"></p>

                    <h2>Acteur</h2>
                    <p id="film-acteurs"></p>

                    <h2>Réalsateur</h2>
                    <p id="film-realisateur"></p>

                    <h2>Note IMDb</h2>
                    <p id="film-note"></p>

                    <h2>Date de sortie</h2>
                    <p id="film-dvd"></p>

                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-top">
            <div class="footer-logo">
                <a href="#logo">
                    <img src="/img/Logo cinéma.png" alt="logo cinéma">
                </a>
            </div>

            <div class="footer-links">
                <a class="n-link" href="/index.html">Acceuil</a>
                <a class="n-link" href="/boutique.html">Boutique</a>
                <a class="n-link" href="#Notre mission">Notre mission</a>
                <a class="n-link" href="/contact.html">Contact</a>
            </div>

            <div class="footer-reseau">
                <a href="/404.html" class="contact-link" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a class="contact-link" href="/404.html" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a class="contact-link" href="/404.html" aria-label="Youtube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
        </div>

        <div class="footer-bottom">
            <p style="text-align: center;">
                &copy; 2026 Athanse NGAIPORO-YAGBENGUE. All rights reserved.
            </p>
        </div>

    </footer>
    <script src="/javascript/movie.js" mode="defer"></script>
</body>
</html>
