<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Movie</title>
  </head>
  <body>
    <!-- Le header et le footer sont intégrés par un script javascript -->
    <header></header>

    <main>
      <section id="short">
        <div class="detail-film">
          <div class="img-film">
            <img id="film-poster" src="" alt="Affiche du film" />
          </div>
          <div class="film-info">
            <h1 id="film-titre">Chargement du film...</h1>

            <p id="film-genre"></p>

            <h2>Synopsis</h2>
            <p id="film-description"></p>

            <h2>Acteur</h2>
            <p id="film-acteurs"></p>

            <h2>Réalisateur</h2>
            <p id="film-realisateur"></p>

            <h2>Note IMDb</h2>
            <p id="film-note"></p>

            <h2>Date de sortie</h2>
            <p id="film-sortie"></p>
          </div>
        </div>
      </section>
    </main>

    <footer></footer>

    <script src="/javascript/movie.js" mode="defer"></script>
    <script src="./javascript/component.js"></script>
  </body>
</html>
