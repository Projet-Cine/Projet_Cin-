<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Search</title>
  </head>
  <body>
    <!-- Le header et le footer sont intégrés par un script javascript -->
    <header></header>

    <main>
      <section class="recherche_section">
        <h1>Rechercher un film</h1>

        <p>
          Taper le titre d'un film pour découvrir le résultat en temps réel.
        </p>

        <form class="search-form">
          <input
            type="text"
            name="query"
            placeholder="Rechercher un film..."
            required
          />
          <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </section>

      <section class="resultats_recherche">
        <h2>Résultats de recherche</h2>
        <div id="search-results"></div>
        
        <button id="btnVoirPlus">Charger plus de films</button>
      </section>
      
    </main>

    <footer></footer>

    <script src="/javascript/search.js" mode="defer"></script>
    <script src="./javascript/component.js"></script>
  </body>
</html>
